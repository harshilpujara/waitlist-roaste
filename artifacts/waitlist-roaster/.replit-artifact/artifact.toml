kind = "web"
previewPath = "/"
title = "Waitlist Roaster"
version = "1.0.0"
id = "artifacts/waitlist-roaster"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23596

[services.development]
run = "pnpm --filter @workspace/waitlist-roaster run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/waitlist-roaster", "run", "build" ]
publicDir = "artifacts/waitlist-roaster/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23596"
BASE_PATH = "/"
